<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>My Dance Recordin tietosuojakäytäntö</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #151228;
      --muted: #5d6680;
      --paper: #f3f9ff;
      --purple: #5b2eff;
      --blue: #7ecbff;
      --pink: #ff6fb7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 111, 183, 0.32), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(126, 203, 255, 0.34), transparent 32rem),
        var(--paper);
    }
    main { width: min(48rem, calc(100% - 2rem)); margin: 0 auto; padding: 4rem 0; }
    .card {
      padding: clamp(1.25rem, 4vw, 3rem);
      border: 1px solid rgba(21, 18, 40, 0.12);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 24px 80px rgba(21, 18, 40, 0.13);
      backdrop-filter: blur(18px);
    }
    h1 { margin: 0 0 0.35rem; font-size: clamp(2rem, 8vw, 4rem); line-height: 0.95; letter-spacing: -0.06em; }
    h2 { margin: 2rem 0 0.5rem; font-size: 1.1rem; color: var(--purple); }
    p, li { color: var(--muted); }
    ul { padding-left: 1.2rem; }
    .meta { margin: 0 0 2rem; color: #d64188; font-weight: 700; }
    .language { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0 0 1.5rem; padding: 0.35rem; border-radius: 1.25rem; background: rgba(91, 46, 255, 0.08); }
    .language span, .language a { padding: 0.35rem 0.75rem; border-radius: 999px; font-size: 0.9rem; font-weight: 700; text-decoration: none; }
    .language span { color: white; background: linear-gradient(135deg, var(--purple), var(--pink)); }
    .language a { color: var(--purple); }
    .contact { display: inline-block; color: var(--purple); font-weight: 700; text-decoration: none; }
    .contact:focus, .contact:hover, .language a:focus, .language a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <h1>My Dance Record Privacy Policy</h1>
      <p class="meta">Updated: 9 June 2026</p>
      <p>The current privacy policy has been updated in English to include the optional Teacher Review feature, teacher codes, text-only student updates, push notifications, recovery codes, and backend retention.</p>
      <p><a class="contact" href="index.html">View the current privacy policy</a>.</p>
    </article>
  </main>
</body>
</html>
